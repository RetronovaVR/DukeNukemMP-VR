[VR]
; EnableVR: 1 = Enable VR mode with direct OpenXR stereoscopic output (0 = disabled / standard 2D game)
EnableVR=1

; DisableCulling: 1 = Completely disable frustum culling (prevents objects and buildings from vanishing at edges)
; In-game hotkey: F8 = toggle on / off
DisableCulling=1

; DebugSBS: 0 = Direct VR headset output via OpenXR (Quest 3 / Link / Virtual Desktop / SteamVR)
;           1 = Test on monitor without headset (Side-by-Side stereo view)
DebugSBS=0

; CameraDistance: Camera distance pullback from Duke
; In-game hotkeys: Page Up = move camera further, Page Down = closer, Home = reset to 3.0
CameraDistance=3

; WorldScale: World scale unit conversion (24.0 = natural 1:1 scale; 1 meter = 24 game units, Duke is 48 units = 2.0m tall)
; In-game hotkeys: Numpad 9 = increase scale (+1.0), Numpad 7 = decrease scale (-1.0), Numpad 8 = reset to 24.0
WorldScale=24.0

; TrackingPosScale: Positional head tracking sensitivity (1.0 = natural 1:1 head movement)
; In-game hotkeys: F12 = recenter view, F11 / Shift+F11 = fine tune (+/- 0.1), F10 = reset to 1.0
TrackingPosScale=1.0

; HudDepth: Virtual distance of the 2D HUD (health, weapons, menu) in 3D space
; In-game hotkeys: Insert = closer, Delete = further away
HudDepth=1.0

; HudScale: Size of the 2D HUD (0.65 = 65% of horizontal field of view)
; In-game hotkeys: [ = decrease HUD size, ] = increase HUD size
HudScale=0.65

; EnableDepthSubmission: 1 = Submit depth buffer to OpenXR for Asynchronous Spacewarp / Timewarp (0 = disabled)
EnableDepthSubmission=1

[Graphics]
; MirrorMode: 0 = Aspect-fit / Pillarbox (clean single image centered on monitor with full HUD)
;             1 = Fullscreen 16:9 crop (fills monitor edge-to-edge)
MirrorMode=1

; Forced resolution for VR rendering (split into Width/2 x Height per eye)
ForceWidescreen=1
Width=4128
Height=2208

; DownscaleWidth: Maximum transfer width over PCIe (2880 = hardware GPU downscale, 0 = full native)
DownscaleWidth=2880

; TransferThreads: Worker thread count for CPU memory copy (default: 4, keeps CPU usage low)
TransferThreads=4

FPSLimit=90

; VR Lens Gamma and Brightness tuning
; In-game hotkeys: Numpad * = increase gamma, Numpad / = decrease gamma
Gamma=0.8
Brightness=1.0
